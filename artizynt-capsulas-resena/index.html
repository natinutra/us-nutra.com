    /* Background div occupies full viewport height */
    .background {
      height: 100vh; /* Full viewport height */
      background-size: cover;
      background-repeat: no-repeat;
      z-index: -1; /* Keeps it behind other content */
      position: relative; /* Changed from absolute to relative for normal flow */

    /* Overlay escuro para dar foco nas opções */
    .background::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      pointer-events: none;
      z-index: 0;

    /* Card único, grafite, com CTA + opções centralizado na tela */
    .gender-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      background-color: #16181d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 2.625rem 3rem;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
      max-width: 90%;
      width: 440px;
      box-sizing: border-box;
    }

    .gender-card__cta {
      margin: 0 0 1.875rem;
      font-size: 1.625rem;
      font-weight: 700;
      color: #f4f4f5;
      letter-spacing: -0.01em;
    }

    /* Linha de cima: Homem | Mulher, lado a lado */
    .gender-wrap-top {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-bottom: 1rem;
    }

    /* Linha de baixo: Prefiro não dizer, maior, sozinho */

      display: grid;
      grid-template-columns: 1fr;

    .gender-option {

      color: #e4e4e7;

      font-weight: 600;

      justify-content: center;
      gap: 0.625rem;

      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 50%;

      font-weight: 700;

      background: linear-gradient(160deg, #ee5aa6 0%, #db2777 100%);
      color: #ffffff;
    }

    .gender-option:hover,
    .gender-option:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      filter: brightness(1.06);

    .gender-option--male:hover,
    .gender-option--male:focus-visible {
      box-shadow: 0 10px 26px rgba(37, 99, 235, 0.45);

    .gender-option--female:hover,
    .gender-option--female:focus-visible {
      box-shadow: 0 10px 26px rgba(219, 39, 119, 0.45);
