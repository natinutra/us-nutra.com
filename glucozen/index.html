    /* Background div occupies full viewport height */
    .background {
      height: 100vh; /* Full viewport height */
      background-size: cover;
      background-repeat: no-repeat;
      z-index: -1; /* Keeps it behind other content */

    /* Overlay escuro para dar foco nas opções */

      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      pointer-events: none;
      z-index: 0;

    /* Card único, grafite, com CTA + opções centralizado na tela */
    .gender-card {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      background-color: #16181d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;

      font-weight: 700;
      color: #f4f4f5;

    .gender-option:hover,
