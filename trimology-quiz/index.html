    <script>
      const questions = ["Have you been struggling to lose weight?","Have you tried different diets without lasting success?","Do you feel your metabolism isn't what it used to be?","Do you often feel hungry even after eating?","A natureza pode vencer fórmulas sintéticas no seu próprio jogo?"];

      let currentQuestionIndex = 0;
      const questionElement = document.getElementById('question');
      const progressElement = document.getElementById('progress');
      const containerElement = document.querySelector('.container');

      function updateProgress() {
        progressElement.textContent = `Respond ${
          currentQuestionIndex + 1
        }/${questions.length}..`;
      }

      function showQuestion() {
        questionElement.textContent = questions[currentQuestionIndex];
        questionElement.classList.remove('slide-out');
        questionElement.classList.add('slide-in');
        updateProgress();
      }

      function showLoading() {
        containerElement.innerHTML = `
                <div class="loading-container">
                    <div class="progress">Just a moment, checking your answers...</div>
                    <div class="loading-icon"></div>
                </div>
            `;
        setTimeout(showFinalMessage, 1500);
      }

      function showFinalMessage() {
        containerElement.innerHTML = `
                <div class="progress">Thank you! We'll redirect you soon...</div>
            `;
        setTimeout(() => {
          click();
        }, 1000);
      }

      function nextQuestion() {
        questionElement.classList.remove('slide-in');
        questionElement.classList.add('slide-out');

        setTimeout(() => {
          currentQuestionIndex++;
          if (currentQuestionIndex < questions.length) {
            showQuestion();
          } else {
            showLoading(); // Última pergunta respondida
          }
        }, 500);
      }

      showQuestion();
